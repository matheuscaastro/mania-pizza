# Render Blueprint: banco Postgres + API + dois sites estáticos (painel admin e app do garçom).
# Depois de criar o Blueprint, ajuste as variáveis marcadas com sync: false no painel do Render.
databases:
  - name: mania-db
    plan: free
    databaseName: mania
    user: mania

services:
  - type: web
    name: mania-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w api
    startCommand: npm run start -w api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: mania-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # defina a senha do primeiro administrador
      - key: SEED_DEMO
        value: "false" # use "true" só para testar com cardápio e usuários de exemplo
      - key: CORS_ORIGIN
        sync: false # URLs dos dois sites abaixo, separadas por vírgula (sem barra final)

  - type: web
    name: mania-admin
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w web-admin
    staticPublishPath: web-admin/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false # URL da mania-api, ex.: https://mania-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mania-garcom
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w web-garcom
    staticPublishPath: web-garcom/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
